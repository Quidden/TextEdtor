name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --windowed --name TextEdtor --paths src --add-data "src/texteditor/ui/app_style.qss;texteditor/ui" --add-data "src/texteditor/ui/check_mark.svg;texteditor/ui" src/main.py

      - name: Package archive
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "manual" }
          $archive = "TextEdtor-$version-windows.zip"
          Compress-Archive -Path dist/TextEdtor -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextEdtor-windows
          path: ${{ env.ARCHIVE }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: TextEdtor ${{ github.ref_name }}
          files: ${{ env.ARCHIVE }}
          body_path: docs/RELEASE_NOTES_v0.1.1.md
